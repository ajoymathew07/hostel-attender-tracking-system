<!DOCTYPE html>
<!--
  The attender's queue, `/m` (sections 10.2, 10.4).

  Mobile-only. Section 10.1 is explicit that this is not the manager's screen at a narrower
  breakpoint: one column, no table, no horizontal scrolling, and tap targets of at least 48px.

  What section 10.2 puts here and this screen does NOT draw:
    - Task actions on the card (START WORK, docket, resolve). The one action on a card is
      opening it, which keeps section 10.2's "never more than one primary action visible per
      task" true; the docket and resolve controls live on the task screen behind that tap.
    - The bottom navigation. Duties and the month's points are one link away, on /m/duties.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{layout/shell :: head('My queue')}">
    <title>My queue · Hostel Duty Tracker</title>
  </head>
  <!--
    The queue refreshes itself, so an attender who leaves the page open sees work the dispatcher
    gave them without pulling to reload. Every 60 seconds rather than the dashboard's 30: a phone
    on hostel wifi pays for each one, and a new task is not something they are watching for
    second by second.
  -->
  <body class="min-h-screen bg-slate-50 text-slate-900" data-refresh-seconds="60">
    <header th:replace="~{layout/shell :: mobileBar('My queue')}"></header>

    <main id="main" class="mx-auto max-w-lg px-4 py-4">
      <div th:replace="~{layout/shell :: flashes}"></div>

      <p class="text-sm text-slate-600 mt-4">
        <span th:text="${#lists.size(tasks)}">0</span> task(s) assigned to you
      </p>

      <!-- Their own standing and nobody else's: the leaderboard is the manager's screen (11.3).
           The number is a SUM over the ledger at render time, never a stored counter (7.3). -->
      <p class="card mt-4 text-base font-medium">
        <span aria-hidden="true">★</span>
        <span th:text="${standing}">0</span> points this month
      </p>

      <a class="btn btn-secondary mt-4" th:href="@{/m/duties}">Duties &amp; my points</a>

      <p th:if="${#lists.isEmpty(tasks)}" class="notice bg-white mt-4">
        Nothing assigned to you right now.
      </p>

      <!-- One card per task, single column. `th:text` throughout: the complaint text is written
           by a resident, so it is the one string here an attacker chooses (section 11.6). -->
      <ul class="list-plain mt-4">
        <li th:each="task : ${tasks}" class="card mt-4">
          <div class="flex items-center gap-2 flex-wrap">
            <span
              class="badge"
              th:classappend="'badge-' + ${#strings.toLowerCase(task.priority())}"
              th:text="${task.priority()}"
              >P2</span
            >
            <!-- Section 4.5: an aged priority says so, so a card that jumped the queue explains
                 itself rather than looking like a mistake. -->
            <span
              class="badge"
              th:if="${task.aged()}"
              th:text="'aged from ' + ${task.basePriority()}"
              >aged from P3</span
            >
            <span class="badge">
              <span aria-hidden="true" th:text="${domainGlyphs.get(task.domain().name())} ?: '❓'">❓</span>
              <span th:text="${task.domain()}">UNCLASSIFIED</span>
            </span>
            <span class="badge" th:text="${task.status()}">NEW</span>
          </div>

          <p class="mt-2 text-sm text-slate-600">
            <span class="font-mono" th:text="${task.publicRef()}">CAU-2026-0001</span>
            <span th:if="${task.room()}" th:text="' · Room ' + ${task.room()}"> · Room 214</span>
          </p>

          <p class="mt-2 text-base font-medium" th:text="${task.rawText()}">what the resident wrote</p>

          <!-- The word "Overdue" carries the meaning; the red is the second signal, never the only
               one (section 10.5). Hold time has already been added to the due date (T13), so a card
               that waited on the Engineering Unit is not shown as late for it. -->
          <p class="mt-1 text-xs text-slate-500" th:if="${task.slaDueAt()} and not ${task.slaOverdue()}">
            <span aria-hidden="true">⏱</span> <span th:text="'Due ' + ${@ist.format(task.slaDueAt())}">due</span>
          </p>
          <p class="mt-1 text-xs text-red-700 font-medium" th:if="${task.slaOverdue()}">
            <span aria-hidden="true">⏱</span>
            <span th:text="'Overdue since ' + ${@ist.format(task.slaDueAt())}">overdue</span>
          </p>

          <!-- Section 11.4: present while the work is live and for 7 days after it is resolved,
               then gone. The service nulls the fields, so there is nothing here to hide. -->
          <p class="mt-2 text-sm" th:if="${task.hasStudentContact()}">
            <span th:text="${task.studentName()} ?: '—'">name</span>
            <span th:if="${task.studentRollNo()}" th:text="' · ' + ${task.studentRollNo()}"> · roll</span>
            <a
              class="block mt-1"
              th:if="${task.studentPhone()}"
              th:href="'tel:' + ${task.studentPhone()}"
              th:text="${task.studentPhone()}"
              >phone</a
            >
          </p>

          <a class="btn btn-lg mt-4" th:href="@{/m/tasks/{id}(id=${task.taskId()})}">
            <span aria-hidden="true">▸</span> Open task
          </a>
        </li>
      </ul>

      <footer th:replace="~{layout/shell :: mobileFooter}"></footer>
    </main>
    <script th:src="@{/js/auto-refresh.js}" defer></script>
  </body>
</html>
