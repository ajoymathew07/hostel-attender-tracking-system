<!DOCTYPE html>
<!--
  Attender admin, `/admin/attenders` (section 10.4) — provisioning and the allowlist.

  Leave and floor coverage, which section 10.4 also puts on this screen, arrive with the modules
  that own them. Styling arrives with the Tailwind shell in PR 4.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users · Hostel Duty Tracker</title>
  </head>
  <body>
    <main>
      <h1>Users and the allowlist</h1>

      <p th:if="${message}" role="status" th:text="${message}">status</p>
      <p th:if="${error}" role="alert" th:text="${error}">error</p>

      <h2>Add a user</h2>
      <form th:action="@{/admin/attenders}" th:object="${form}" method="post">
        <p>
          <label for="displayName">Name</label>
          <input type="text" id="displayName" th:field="*{displayName}" required maxlength="128" />
          <span th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">name error</span>
        </p>
        <p>
          <label for="email">Google address</label>
          <input type="email" id="email" th:field="*{email}" required maxlength="255" />
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">email error</span>
        </p>
        <p>
          <label for="role">Role</label>
          <select id="role" th:field="*{role}">
            <option th:each="option : ${roles}" th:value="${option}" th:text="${option}">ROLE</option>
          </select>
        </p>
        <button type="submit">Add to allowlist</button>
      </form>

      <h2>Current users</h2>
      <table>
        <caption>
          Deactivating blocks the next sign-in immediately. A user is never deleted, so their
          history keeps naming a real person.
        </caption>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Google address</th>
            <th scope="col">Role</th>
            <th scope="col">Status</th>
            <th scope="col">Last sign-in</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.displayName()}">Name</td>
            <td th:text="${user.email()}">address</td>
            <td>
              <form th:action="@{'/admin/attenders/' + ${user.id()} + '/role'}" method="post">
                <label th:for="'role-' + ${user.id()}" class="sr-only">Role</label>
                <select th:id="'role-' + ${user.id()}" name="role">
                  <option
                    th:each="option : ${roles}"
                    th:value="${option}"
                    th:text="${option}"
                    th:selected="${option == user.role()}">
                    ROLE
                  </option>
                </select>
                <button type="submit">Set role</button>
              </form>
            </td>
            <td th:text="${user.active()} ? 'Active' : 'Deactivated'">Active</td>
            <td th:text="${user.lastLoginAt()} ?: 'never'">never</td>
            <td>
              <form
                th:if="${user.active()}"
                th:action="@{'/admin/attenders/' + ${user.id()} + '/deactivate'}"
                method="post">
                <button type="submit">Deactivate</button>
              </form>
              <form
                th:unless="${user.active()}"
                th:action="@{'/admin/attenders/' + ${user.id()} + '/reactivate'}"
                method="post">
                <button type="submit">Reactivate</button>
              </form>
              <form th:action="@{'/admin/attenders/' + ${user.id()} + '/email'}" method="post">
                <label th:for="'email-' + ${user.id()}">New Google address</label>
                <input type="email" th:id="'email-' + ${user.id()}" name="email" required maxlength="255" />
                <button type="submit">Repoint</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
