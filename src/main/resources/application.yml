# Base configuration. Profile-specific documents follow.
#   local — developer machine, against the Postgres in docker-compose.yml
#   cloud — Render and the manager's standby jar (architecture section 2.6)
#
# There is deliberately NO `spring.profiles.default`. It used to be `local`, which meant an unset
# SPRING_PROFILES_ACTIVE in the cloud silently started the app with developer settings — throwaway
# OAuth placeholders, no Secure cookie, and a datasource pointing at localhost. Exactly one profile
# must now be named explicitly, and ProfileCheck fails the start with instructions if none is.
spring:
  application:
    name: duty-tracker

  jpa:
    # The schema is owned by Flyway (architecture section 2.7); Hibernate never creates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Every TIMESTAMP column is written and read as UTC (NFR-7, overview
          # section 1). Asia/Kolkata is a *presentation* and business-date
          # concern, applied in web/reporting, never at the JDBC boundary.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Forward-only, versioned, PostgreSQL-only (architecture section 2.7).
    baseline-on-migrate: false
    validate-on-migrate: true

  # Google OIDC — the one sign-in mechanism (ADR-002). The `google` provider's endpoints are
  # built into Spring Security, so startup makes no discovery call.
  #
  # The client id and secret are environment variables (section 11.5); they authenticate the
  # *application* to Google and are not anyone's credential. The placeholder defaults exist so the
  # context starts on a developer machine and in CI — a sign-in attempt against them fails at
  # Google, which is the correct outcome for a machine with no client registered. The `cloud`
  # profile re-declares both without a default, so a real deployment cannot start on a placeholder.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:duty-tracker-local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:duty-tracker-local-placeholder}
            scope: openid,email,profile

  # Upload safety, section 11.6. The container refuses an oversize part before any of our code
  # runs; `ingestion.upload.max-bytes` below is the same limit enforced in the service, which is
  # the one that is tested and that a non-HTTP caller would also meet.
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  threads:
    virtual:
      enabled: false

# Ingestion, section 5.2. Every one of these is a tunable rather than a constant (section 2.7),
# because form question wording and column order *will* change (OQ-4) and the fix must be a config
# edit rather than a redeploy.
#
# The design writes this block at `ingestion.sheets.columns`. It is at `ingestion.columns` here
# because the CSV fallback is a download of the very same response sheet (section 5.8) and so has
# the very same headers: one mapping, shared by both sources, is the whole point of the shared
# port. See IngestionProperties.
ingestion:
  columns:
    timestamp: ["Timestamp", "Submitted at"]
    email: ["Email Address", "Email"]
    name: ["Name", "Student Name", "Full Name"]
    rollNo: ["Roll Number", "Roll No", "Roll"]
    phone: ["Phone Number", "Contact Number", "Mobile"]
    room: ["Room Number", "Room No", "Room"]
    description: ["Describe the issue", "Complaint", "Issue"]
    # Optional resident-supplied hint; consumed by the classifier in PR 10.
    category: ["Type of issue"]

  # An unresolvable *required* column fails the whole run loudly rather than ingesting garbage.
  # `name`, `rollNo` and `phone` are deliberately absent: a Form that does not ask for them still
  # ingests, and the attender sees the room number alone (section 11.4).
  required: [timestamp, description]

  # The shapes a Google Form timestamp arrives in; which one depends on the sheet's locale.
  timestamp-patterns:
    - "yyyy/MM/dd HH:mm:ss"
    - "yyyy-MM-dd HH:mm:ss"
    - "dd/MM/yyyy HH:mm:ss"
    - "yyyy/MM/dd HH:mm"

  # Form timestamps are wall-clock local time; storage is UTC (NFR-7).
  zone: Asia/Kolkata

  upload:
    max-bytes: 5242880 # 5 MB (section 11.6)
    max-rows: 5000

  # The Google Form response sheet (sections 2.5, 5.3, 11.5).
  #
  # All three may be absent, and on a developer machine and in CI they are: the service-account
  # key is an environment variable and never a file in this repository, so there is nothing to
  # commit and nothing to leak. Without them the application starts exactly as it does now, the
  # poll skips with a debug line and the CSV fallback — the other half of the same port — keeps
  # working. That is deliberate, not a degraded mode.
  sheets:
    spreadsheet-id: ${GOOGLE_SHEET_ID:}
    sheet-name: ${GOOGLE_SHEET_NAME:Form Responses 1}
    # Base64 service-account JSON (section 11.5). Read-only on the one response sheet.
    credentials: ${GOOGLE_SA_KEY:}
    # One read per three minutes is ~0.1% of the 300-reads-per-minute quota (section 5.3).
    # ISO-8601, because `@Scheduled` reads this same string and accepts only that form.
    poll-interval: PT3M

    # The shared secret the Google Apps Script trigger presents to wake a sleeping instance
    # (sections 2.5, 11.5). Generate it, paste it into the script and into the platform's
    # environment; see docs/runbook/google-setup.md.
    #
    # Absent here and on every developer machine, which *closes* the endpoint rather than opening
    # it: with no secret configured there is nothing a caller can match. Read by
    # SheetWakeController with @Value rather than bound onto SheetsProperties, because a
    # controller may not depend on an infrastructure class (architecture section 2.4, rule 2).
    wake-secret: ${INGESTION_WAKE_SECRET:}

# The classifier's confidence gate, section 5.5. Both numbers are the defaults the design states
# outright, and both are properties rather than constants because section 5.5 says they are tuned
# against the gold set of section 12.3 — which is a later PR, so nothing has moved them yet.
#
#   minimum-score        S_min — absolute evidence: the winning domain's total must reach this
#   confidence-threshold τ     — separation: (S₁ − S₂) / S₁ must reach this
#
# Both gates must pass. One absolute threshold alone accepts a complaint that scores equally for
# two domains; one margin threshold alone accepts a complaint where a single weak term matched and
# nothing else did. Requiring both routes exactly the uncertain cases to the manager's triage queue.
categorization:
  minimum-score: 1.0
  confidence-threshold: 0.40

# The docket gate, transition T11 (OQ-1). There is no CMS API (section 1.8), so only the format can
# be validated, and the exact format of an IITM EU CMS docket number is still an open question —
# hence a property rather than a constant: a wrong guess costs a config edit, not a redeploy. The
# permissive default is the working answer recorded against OQ-1.
workflow:
  docket-pattern: "^[A-Za-z0-9/-]{4,32}$"

  # Priority, the SLA clock and aging (section 4.5). Configuration rather than constants because
  # both sections that state these numbers say so outright — section 4.5 of the working calendar
  # ("configurable by the manager rather than compiled in") and section 8.2 of the targets ("These
  # are configuration, not constants") — and because both are still open questions: OQ-2 for the
  # windows, OQ-6 for the working day. A revised figure is a config edit, not a redeploy.
  sla:
    # OQ-6's working answer. The SLA figures below are spent only inside this window, so a
    # complaint submitted at 23:00 does not burn four hours of its window overnight while nobody
    # is on duty. Seven days a week, which is why `non-working-days` is empty rather than absent:
    # a hostel does not close on Sunday. Both lists exist because section 4.5 names weekends and
    # holidays as part of what a manager may set.
    working-day:
      zone: Asia/Kolkata
      start: "08:00"
      end: "20:00"
      non-working-days: []
      holidays: []

    # Section 8.2's table, in working hours. Section 4.5 states the same figures more coarsely
    # ("Electrical 4h · Other 8h" for P1) and section 8.2 spells out every cell, so these are
    # section 8.2's: the breach metric and the due date on the attender's card must not be able to
    # disagree about what "late" means. UNCLASSIFIED has no row — a complaint nobody has placed is
    # waiting on a manager in the triage queue, and it gets its due date when it gets its domain.
    targets:
      ELECTRICAL: { P1: PT4H, P2: PT8H, P3: PT72H }
      RO_PLANT: { P1: PT6H, P2: PT12H, P3: PT72H }
      CIVIL: { P1: PT8H, P2: PT24H, P3: PT72H }
      NETWORK: { P1: PT8H, P2: PT24H, P3: PT72H }

    # How often the aging sweep runs. Far finer than the shortest window it polices, so an
    # escalation is late by at most one tick, and cheap: one indexed query over the overdue set.
    # ISO-8601, because `@Scheduled` reads this same string and accepts only that form.
    ageing-interval: PT15M

# The dispatch heuristic, section 6.2. Every number here is a tunable rather than a constant
# because section 6.2 says so outright (R5: "tunable without a redeploy") and because the manager
# edits them from the configuration screen. The defaults are the figures the design states.
dispatch:
  # Cauvery room numbers carry a floor but not a wing (section 5.4), while `floor` is keyed
  # (wing, floor_number). One wing, named here, is how a room number resolves to a floor_id.
  wing: CAUVERY

  # w_f and w_l. Floor is the stakeholder's stated primary criterion; load is weighted strongly
  # enough to override it when somebody is badly overloaded. They must sum to 1, or the score
  # would not be in [0, 1] and the weights would stop reading as percentages.
  weights:
    floor: 0.60
    load: 0.40

  # L_cap. Above this an attender scores 0 on load; at or over it for everyone, the work is
  # assigned anyway and the manager is told the queue is saturated (section 6.4).
  load-cap: 8

  # Section 6.2's floor-proximity table. Distant attenders score above zero deliberately: when the
  # primary is unavailable somebody still has to go.
  proximity:
    primary: 1.00
    secondary: 0.70
    adjacent: 0.40
    step: 0.05
    minimum: 0.10

# A lost or shared phone exposes a session, not a secret — so the session is the thing that
# expires (sections 11.1, 11.2). `Secure` is set by the `cloud` profile below, where TLS
# terminates; setting it here would break sign-in over plain http on a developer machine.
server:
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

# Actuator, architecture section 2.7. The hosting platform pings a health check to decide whether
# a deploy succeeded, so `/actuator/health` is the one endpoint that answers without a session
# (SecurityConfig). Everything else under /actuator is left unexposed rather than merely
# authenticated: an endpoint that is not mapped cannot leak, whatever the filter chain does.
#
# `show-details: never` is what keeps the public answer to a bare {"status":"UP"} — no component
# breakdown, no database name, no disk figures, no build or environment detail (section 11.1).
management:
  endpoints:
    web:
      exposure:
        include: health
      # `/actuator` itself otherwise answers with a link index. It would list only health, but an
      # endpoint that enumerates endpoints is not one the platform needs, so it is off.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      # Free with the health endpoint: /actuator/health/readiness and /actuator/health/liveness.
      probes:
        enabled: true

logging:
  level:
    in.ac.iitm.hostel.duty: INFO

---
spring:
  config:
    activate:
      on-profile: local

  # Credentials match docker-compose.yml. Secrets are environment variables only
  # (architecture section 2.7); these defaults are for a throwaway local container.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duty_tracker}
    username: ${DATABASE_USERNAME:duty_tracker}
    password: ${DATABASE_PASSWORD:duty_tracker}
    hikari:
      pool-name: duty-tracker-pool
      maximum-pool-size: 10

  thymeleaf:
    cache: false

logging:
  level:
    in.ac.iitm.hostel.duty: DEBUG

---
# Render, and the standby jar on the manager's desktop — the same jar, the same profile, the same
# database, differing only in where it is started (architecture section 2.6, ADR-001).
#
# Every value below comes from the environment and NONE has a default. That is the point: a
# missing variable fails the start with its own name in the message, instead of falling back to a
# developer default and quietly running against the wrong database. Secrets are environment
# variables only, never files (section 11.5). Set them per docs/runbook/deploy.md.
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: duty-tracker-pool
      # Managed free-tier PostgreSQL allows few connections, and the standby may be holding some
      # at the same time. Eight users do not need more.
      maximum-pool-size: 5

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  thymeleaf:
    cache: true

server:
  # Render assigns the port at runtime and expects the app to bind to it. The standby has no PORT
  # set and so gets 8080 — which is the port in the registered localhost redirect URI (ADR-002).
  port: ${PORT:8080}

  # TLS terminates at Render's proxy, so the request Tomcat sees is plain http on an internal
  # address. Without this the OAuth redirect_uri Spring Security builds would say `http://` and
  # Google would reject it as not matching the registered https URI. Harmless on the standby,
  # which receives no X-Forwarded-* headers.
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        # Cloud only. The browser must never send the session cookie over plain http — and setting
        # this on the `local` profile would break sign-in on a developer machine, which has no TLS.
        secure: true
