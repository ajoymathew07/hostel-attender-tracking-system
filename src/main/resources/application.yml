# Base configuration. Profile-specific documents follow.
#   local — developer machine, against the Postgres in docker-compose.yml
#   cloud — Render/Railway and the manager's standby jar (arrives with PR 7)
spring:
  application:
    name: duty-tracker
  profiles:
    default: local

  jpa:
    # The schema is owned by Flyway (architecture section 2.7); Hibernate never creates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Every TIMESTAMP column is written and read as UTC (NFR-7, overview
          # section 1). Asia/Kolkata is a *presentation* and business-date
          # concern, applied in web/reporting, never at the JDBC boundary.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Forward-only, versioned, PostgreSQL-only (architecture section 2.7).
    baseline-on-migrate: false
    validate-on-migrate: true

  # Google OIDC — the one sign-in mechanism (ADR-002). The `google` provider's endpoints are
  # built into Spring Security, so startup makes no discovery call.
  #
  # The client id and secret are environment variables (section 11.5); they authenticate the
  # *application* to Google and are not anyone's credential. The placeholder defaults exist so the
  # context starts on a developer machine and in CI — a sign-in attempt against them fails at
  # Google, which is the correct outcome for a machine with no client registered.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:duty-tracker-local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:duty-tracker-local-placeholder}
            scope: openid,email,profile

  threads:
    virtual:
      enabled: false

# A lost or shared phone exposes a session, not a secret — so the session is the thing that
# expires (sections 11.1, 11.2). `Secure` is added with the cloud profile in PR 7, where TLS
# terminates; setting it here would break sign-in over plain http on a developer machine.
server:
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

# Actuator health/metrics (architecture section 2.7) arrive with the cloud
# deployment in PR 7, together with the spring-boot-starter-actuator dependency.

logging:
  level:
    in.ac.iitm.hostel.duty: INFO

---
spring:
  config:
    activate:
      on-profile: local

  # Credentials match docker-compose.yml. Secrets are environment variables only
  # (architecture section 2.7); these defaults are for a throwaway local container.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/duty_tracker}
    username: ${DATABASE_USERNAME:duty_tracker}
    password: ${DATABASE_PASSWORD:duty_tracker}
    hikari:
      pool-name: duty-tracker-pool
      maximum-pool-size: 10

  thymeleaf:
    cache: false

logging:
  level:
    in.ac.iitm.hostel.duty: DEBUG
