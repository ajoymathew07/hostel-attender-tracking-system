name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify
        run: mvn -B verify
        if: hashFiles('pom.xml') != ''

      - name: Skip (no Maven project yet)
        run: echo "No pom.xml present yet — build step skipped."
        if: hashFiles('pom.xml') == ''

  docs:
    name: Design doc renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links are not obviously broken
        run: |
          set -e
          find docs -name '*.md' -print0 | xargs -0 -r grep -l . >/dev/null
          echo "docs present"
