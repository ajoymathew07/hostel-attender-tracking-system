name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-java's `cache: maven` fails outright when there is no pom.xml to
      # key the cache on, so the whole job has to be gated before that step runs
      # rather than only around the build itself.
      - name: Detect Maven project
        id: maven
        run: |
          if [ -f pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.maven.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify
        if: steps.maven.outputs.present == 'true'
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always() && steps.maven.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure() && steps.maven.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Skip (no Maven project on this branch)
        if: steps.maven.outputs.present == 'false'
        run: echo "No pom.xml on this branch — nothing to build."

  docs:
    name: Design doc renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links are not obviously broken
        run: |
          set -e
          find docs -name '*.md' -print0 | xargs -0 -r grep -l . >/dev/null
          echo "docs present"
